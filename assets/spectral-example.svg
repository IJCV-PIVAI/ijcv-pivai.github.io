<title id="title">Synthetic reflectance spectra with an absorption feature</title>
<desc id="description">A noisy observation, a known synthetic reference, and an illustrative estimate share the same wavelength samples. The estimate retains a narrow absorption feature. These are synthetic curves, not dataset measurements or an algorithm's results. Reflectance is dimensionless. Colors identify curves, not visible wavelengths.</desc>
